name: Build Pret-arium Switcher

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitppc:latest

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITPPC: /opt/devkitpro/devkitPPC

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITPPC=$DEVKITPPC"
          powerpc-eabi-g++ --version
          ls /opt/devkitpro/wut

      - name: Build Pret-arium Switcher
        run: |
          make clean
          make -j$(nproc)

      - name: Show build output
        run: |
          find build -maxdepth 3 -type f -print

      - name: Verify WUHB
        run: |
          test -f build/pretarium_switcher.wuhb

      - name: Upload Pret-arium Switcher
        uses: actions/upload-artifact@v4
        with:
          name: Pret-arium-Switcher
          path: build/pretarium_switcher.wuhb
          if-no-files-found: error
