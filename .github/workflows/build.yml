name: Build Pret-arium Switcher

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitppc:latest

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITPPC: /opt/devkitpro/devkitPPC
      PATH: /opt/devkitpro/devkitPPC/bin:/opt/devkitpro/tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITPPC=$DEVKITPPC"
          "$DEVKITPPC/bin/powerpc-eabi-g++" --version
          ls -la "$DEVKITPRO/wut"

      - name: Build Pret-arium Switcher
        run: |
          make clean
          make -j$(nproc)

      - name: Show build output
        run: |
          find build -maxdepth 4 -type f -print

      - name: Verify WUHB
        run: |
          test -f build/pretarium_switcher.wuhb

      - name: Upload Pret-arium Switcher
        uses: actions/upload-artifact@v4
        with:
          name: Pret-arium-Switcher
          path: build/pretarium_switcher.wuhb
          if-no-files-found: error
